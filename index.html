<!DOCTYPE html>

    <title>Meet - Find Your Match</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #fce3ec, #ffe8d6);
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header-text {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 20px;
            color: #d6336c;
            font-size: 24px;
            font-weight: bold;
        }

        /* الحاوية اللي بتخفي أي حاجة بره الشاشة */
        .marquee-wrapper {
            width: 100vw;
            overflow: hidden;
            position: relative;
            display: flex;
            margin: 15px 0;
        }

        /* المحتوى اللي بيتحرك */
        .marquee-content {
            display: flex;
            gap: 15px;
            width: max-content;
            animation: scroll-left 20s linear infinite;
        }

        .marquee-content.reverse {
            animation: scroll-right 20s linear infinite;
        }

        /* كارت الصورة */
        .profile-card {
            width: 150px;
            height: 200px;
            border-radius: 15px;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }

        .profile-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-name {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            font-size: 18px;
        }

        .heart-icon {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #d6336c;
            font-size: 16px;
        }

        /* حركة الشريط */
        @keyframes scroll-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        @keyframes scroll-right {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(0); }
        }

        /* زرار التحميل */
        .download-btn {
            background-color: #ff4d6d;
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            font-size: 20px;
            font-weight: bold;
            margin-top: 40px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
            transition: transform 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .download-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
